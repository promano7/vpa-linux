#
# vpa.cfg — configuracion de compilacion del port de VPA a GNU/Linux.
# (Se llama vpa.cfg, NO fpc.cfg: un fpc.cfg local eclipsaria al /etc/fpc.cfg del
#  sistema y FPC no encontraria su RTL ni las units graficas.)
#
# Uso desde la raiz del proyecto:
#   fpc @vpa.cfg VPA/VPA.PAS
#

# Dialecto Turbo/Borland Pascal (compatibilidad con el codigo original)
-Mtp

# Comprobaciones de runtime DESACTIVADAS, como el BPC.CFG original (/$I-,R-,S-,Q-).
# Imprescindible: el codigo comprueba IOResult tras Reset/Rewrite (chequeo E/S off);
# si no, un fichero ausente lanza EInOutError 217. Range-check off evita ademas
# errores 201 por indices/constantes fuera de rango intencionados del original.
-Ci-
-Cr-
-Co-
-Ct-

# Units e includes del proyecto
-FuVPA
-FuUNIT
-FuVHLP
-FuCC
-FiVPA
-FiCC

# ptcgraph/ptccrt/ptcmouse: FPC las localiza via /etc/fpc.cfg del sistema
# (paquete 'fpc' en Arch). No hace falta ruta explicita y asi es portable.

# Salida (.ppu/.o y ejecutable) en ./build
-FUbuild
-FEbuild

# Avisos y notas
-vwn
