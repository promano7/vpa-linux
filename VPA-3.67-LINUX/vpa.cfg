#
# fpc.cfg — configuracion de compilacion del port de VPA a GNU/Linux (Fase 1)
# Sustituye al BPC.CFG de Borland Pascal.
#
# Uso (desde la raiz del proyecto):
#   fpc @fpc.cfg UNIT/STRF.PAS      # compilar una unit suelta (bottom-up)
#   fpc @fpc.cfg VPA/vpa.pas        # intentar el programa completo (fallara al principio)
#
# NOTA: la ruta de units de ptcgraph es la verificada en Arch (FPC 3.2.2).
#       Si actualizas FPC, ajusta el numero de version en la linea -Fu de abajo.
#

# --- Dialecto: Turbo Pascal / Borland (compatibilidad con el codigo original) ---
-Mtp

# --- Rutas de busqueda de units del proyecto ---
-FuVPA
-FuUNIT
-FuVHLP
-FuCC

# --- Units graficas de FPC (ptcgraph / ptccrt / ptcmouse) ---
# Ruta verificada en Arch Linux. En Ubuntu seria /usr/lib/x86_64-linux-gnu/fpc/...
-Fu/usr/lib/fpc/3.2.2/units/x86_64-linux/graph

# --- Rutas de busqueda de includes (switches.inc, rusfont.inc estan en VPA/) ---
-FiVPA
-FiCC

# --- Salida: units compiladas (.ppu/.o) y ejecutable en ./build ---
-FUbuild
-FEbuild

# --- Diagnostico: mostrar avisos y notas para mapear el terreno en el 1er compilado ---
-vwni

# --- (Comentado) Defines del port; los activaremos segun avancemos ---
# -dLINUX_PORT
