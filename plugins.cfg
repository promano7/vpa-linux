#
# plugins.cfg - configuracion de compilacion de los plugins graficos (.so) de
# BACKENDS/. Tarea T5.1 de WAYLAND.md.
#
# Uso desde la raiz del proyecto (lo hace el Makefile, objetivo 'plugins'):
#   fpc @plugins.cfg -obuild/plugins/libvpagraph-x11.so BACKENDS/X11/vpagraph_x11.lpr
#
# NO hereda nada de vpa.cfg: los plugins son codigo nuevo en modo objfpc y se
# compilan con las comprobaciones de runtime ACTIVADAS durante el desarrollo
# (cada adaptador captura sus propias excepciones; ninguna cruza la ABI).
#
# Solo se aplica al codigo propio de BACKENDS/. Las unidades vendorizadas que
# el plugin envuelve (ptc, ptcwrapper, ptcgraph) se compilan aparte, con
# codigo independiente de posicion y las mismas opciones que hoy (-O2, sin
# comprobaciones), por el objetivo 'plugin-units' del Makefile: asi el .so
# dibuja exactamente lo mismo que el ptcgraph enlazado en el ejecutable.
# Por eso aqui NO hay -FuVENDOR: si falta un .ppu de build/plugins/units/ la
# compilacion falla en vez de recompilar ptcgraph con estas opciones.
#

# Modo objfpc con cadenas largas por defecto
-MOBJFPC
-Sh

# Codigo independiente de posicion: obligatorio para una biblioteca compartida
-Cg

# Comprobaciones de runtime activadas (E/S, rango, desbordamiento, pila)
-Ci
-Cr
-Co
-Ct

# Informacion de linea para que un fallo interno diga donde ocurrio
-gl

# El contrato de la ABI (GRAPH/vpagraph_abi.inc)
-FiGRAPH

# Unidades vendorizadas compiladas en PIC por 'make plugin-units'
-Fubuild/plugins/units

# Salida (.ppu/.o y el .so) en build/plugins
-FUbuild/plugins
-FEbuild/plugins

# Avisos y notas
-vwn
